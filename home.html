<!DOCTYPE html>
<html lang="en">
<head>
    <title>EventFlow</title>
    <link rel="stylesheet" href="CSS/home.css">
</head>
<body>

<nav>
    <h1>EventFlow</h1>
    <p class="tagline">Smart Event Scheduling Platform</p>
</nav>

<main>
    <div class="image-row">

        <div class="card">
            <img src="assets/images/user.jpg" alt="User">
            <h3>User</h3>
            <p>View and track events</p>
            <div class="card-buttons">
                <button class="btn btn-primary" onclick="openUserSignin()">Sign In</button>
                <button class="btn btn-secondary" onclick="openUserSignup()">Sign Up</button>
            </div>
        </div>

        <div class="card">
            <img src="assets/images/admin.jpg" alt="Admin">
            <h3>Admin</h3>
            <p>Create and manage events</p>
            <div class="card-buttons">
                <button class="btn btn-primary" onclick="openAdminSignin()">Sign In</button>
            </div>
        </div>

    </div>
</main>

<!-- User Sign In Modal -->
<div id="userSigninModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('userSigninModal')">&times;</span>
        <h2>User Sign In</h2>
        <form id="userSigninForm">
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Sign In</button>
            <p class="form-link">Don't have an account? <a href="#" onclick="switchModal('userSigninModal', 'userSignupModal')">Sign Up</a></p>
        </form>
    </div>
</div>

<!-- User Sign Up Modal -->
<div id="userSignupModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('userSignupModal')">&times;</span>
        <h2>Create User Account</h2>
        <form id="userSignupForm">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password (min 6 characters)" required minlength="6">
            <input type="password" placeholder="Confirm Password" required>
            <input type="tel" placeholder="Phone Number" required>
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <p class="form-link">Already have an account? <a href="#" onclick="switchModal('userSignupModal', 'userSigninModal')">Sign In</a></p>
        </form>
    </div>
</div>

<!-- Admin Sign In Modal -->
<div id="adminSigninModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('adminSigninModal')">&times;</span>
        <h2>Admin Sign In</h2>
        <form id="adminSigninForm">
            <input type="text" placeholder="Admin ID" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
    </div>
</div>

<footer>
    © 2026 EventFlow. All rights reserved.
</footer>

<script src="JS/home.js"></script>

</body>
</html>
